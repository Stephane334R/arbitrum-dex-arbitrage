[project]
name = "arbitrum-dex-arbitrage"
version = "0.1.0"
description = "Research and execution system for atomic arbitrage between Uniswap v3-family pools on Arbitrum One"
readme = "README.md"
authors = [
    { name = "Roblet Stephane", email = "robletstephane334@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "web3>=8.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs ARBITRUM_RPC_URL (archive RPC) and/or the local swap cache"]
